server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: update
    properties.hibernate:
      format_sql: true
      jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
app:
  demo-seed: ${DEMO_SEED:false}
  jwt:
    secret: ${JWT_SECRET:TaskFlow-Local-Development-Secret-Key-Replace-In-Production-2026}
    access-minutes: 15
    refresh-days: 7
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
